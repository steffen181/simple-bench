[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracking-bench"
version = "0.1.0"
description = "Reproducible state-tracking benchmarks and BBH comparison for closed-model APIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt", "LICENSE_STATUS.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "Jinja2>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]
analysis = ["numpy>=1.24,<3"]
campaign = ["igraph==0.11.9"]

[project.scripts]
tracking-bench = "tracking_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracking_bench = ["data/*.json", "data/*.md", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
